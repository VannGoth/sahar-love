<!doctype html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sahar">
<meta name="theme-color" content="#14040a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<title>Sahar Love</title>
<style>
  :root {
    --bg-0:#0e0206; --bg-1:#1d050d; --bg-2:#3a0a1b;
    --red:#e11d48; --red-2:#be123c; --red-3:#881337; --rose:#fb7185;
    --gold-1:#fff1c1; --gold-2:#f3d27a; --gold-3:#d4af37; --gold-4:#9a7420;
    --cream:#fff5ea; --muted:#d9b8b8; --muted-2:#a77f86;
    --card:rgba(60,10,28,.55); --card-line:rgba(243,210,122,.28);
    --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    --font-display:"Cormorant Garamond",Georgia,serif;
    --tab-h:72px;
  }
  html[dir="rtl"] { --font-ui:"Vazirmatn",-apple-system,system-ui,sans-serif; --font-display:"Vazirmatn",serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body {
    background:
      radial-gradient(120% 70% at 50% -10%, var(--bg-2) 0%, rgba(58,10,27,0) 60%),
      radial-gradient(90% 60% at 50% 110%, #2b0612 0%, rgba(43,6,18,0) 70%),
      var(--bg-1);
    color:var(--cream); font-family:var(--font-ui);
    overflow-x:hidden; -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  }
  #sky { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  #fx  { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:50; }
  .hidden { display:none !important; }

  main {
    position:relative; z-index:1; max-width:480px; margin:0 auto; min-height:100%;
    display:flex; flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 10px) 20px calc(env(safe-area-inset-bottom) + 20px);
  }
  main.with-tabs { padding-bottom:calc(env(safe-area-inset-bottom) + var(--tab-h) + 24px); }

  /* ---------- Cabecera ---------- */
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:56px; }
  .logo {
    font-family:"Great Vibes",cursive; font-size:44px; line-height:1; padding:6px 4px 0;
    background:linear-gradient(180deg,var(--gold-1) 10%,var(--gold-2) 45%,var(--gold-3) 70%,var(--gold-4));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 10px rgba(212,175,55,.35));
  }
  .brand { display:flex; align-items:flex-end; gap:6px; }
  .brand small { font-size:10px; letter-spacing:.38em; color:var(--gold-3); font-weight:700; padding-bottom:9px; }
  .together { text-align:center; margin-top:6px; font-size:14px; color:var(--rose); letter-spacing:.02em; }
  .us-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .stat { text-align:center; padding:14px 8px; border-radius:16px; background:rgba(255,255,255,.03); border:1px solid rgba(243,210,122,.16); }
  .stat b { display:block; font-family:var(--font-display); font-size:32px; line-height:1; background:linear-gradient(180deg,var(--gold-1),var(--gold-3)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  html[dir="rtl"] .stat b { font-family:"Vazirmatn"; font-size:28px; }
  .stat span { display:block; color:var(--muted-2); font-size:13px; margin-top:6px; }
  .since-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .since-row label { color:var(--gold-2); font-size:15px; font-weight:600; }
  .since-row input { margin:0; width:auto; max-width:56%; padding:10px 12px; font-size:16px; color-scheme:dark; }
  .letter .btn { margin:6px 0 12px; }
  .lang {
    position:relative; display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:999px;
    background:rgba(255,255,255,.05); border:1px solid var(--card-line); color:var(--gold-2); font-size:14px;
  }
  .lang select { position:absolute; inset:0; opacity:0; width:100%; font-size:16px; }
  .lang svg { width:16px; height:16px; }

  /* ---------- Tipografía y controles ---------- */
  h1 { font-family:var(--font-display); font-weight:600; font-size:34px; line-height:1.1; margin:22px 0 8px; color:var(--gold-1); }
  html[dir="rtl"] h1 { font-size:28px; font-weight:700; }
  h2 { font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold-2); font-weight:600; margin:26px 0 10px; }
  html[dir="rtl"] h2 { letter-spacing:0; font-size:15px; }
  p.sub { color:var(--muted); margin:0 0 22px; line-height:1.5; font-size:16px; }
  .tagline { font-family:var(--font-display); font-style:italic; font-size:22px; color:var(--muted); margin:2px 0 26px; }
  html[dir="rtl"] .tagline { font-style:normal; font-size:18px; }

  input, button, select { font:inherit; }
  .field {
    width:100%; padding:16px 18px; border-radius:16px; border:1px solid var(--card-line);
    background:rgba(20,4,10,.6); color:var(--cream); font-size:17px; outline:none; margin-bottom:12px;
    transition:border-color .2s, box-shadow .2s;
  }
  .field::placeholder { color:var(--muted-2); }
  .field:focus { border-color:var(--gold-2); box-shadow:0 0 0 4px rgba(243,210,122,.15); }
  .btn {
    position:relative; overflow:hidden; width:100%; padding:16px; border:0; border-radius:16px; cursor:pointer;
    font-weight:650; font-size:17px; letter-spacing:.01em; color:#fff; margin-bottom:12px;
    background:linear-gradient(135deg,var(--red) 0%,var(--red-2) 55%,var(--red-3) 100%);
    box-shadow:0 10px 30px rgba(225,29,72,.35), inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .12s, filter .2s;
  }
  .btn::after { content:""; position:absolute; inset:0; background:linear-gradient(110deg,transparent 30%,rgba(255,241,193,.35) 50%,transparent 70%); transform:translateX(-120%); animation:shine 3.6s infinite; }
  .btn:active { transform:scale(.98); }
  .btn:disabled { filter:grayscale(.5) brightness(.8); }
  .btn.gold { color:#3a1206; background:linear-gradient(135deg,var(--gold-1),var(--gold-2) 45%,var(--gold-3)); box-shadow:0 10px 30px rgba(212,175,55,.25), inset 0 1px 0 rgba(255,255,255,.6); }
  .btn.ghost { background:rgba(255,255,255,.04); border:1px solid var(--card-line); color:var(--gold-1); box-shadow:none; }
  .btn.ghost::after { display:none; }
  @keyframes shine { 0%,60% { transform:translateX(-120%); } 100% { transform:translateX(120%); } }
  .err { color:#fda4af; min-height:22px; font-size:14px; margin:2px 0 8px; }

  .card { background:var(--card); border:1px solid var(--card-line); border-radius:22px; padding:18px; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }

  /* Entrada animada de las vistas */
  .view { animation:rise .55s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }

  /* ---------- Instalar ---------- */
  .steps { counter-reset:s; list-style:none; padding:0; margin:0; }
  .steps li { counter-increment:s; display:flex; gap:14px; align-items:flex-start; padding:12px 0; line-height:1.45; border-bottom:1px solid rgba(243,210,122,.12); }
  .steps li:last-child { border:0; }
  .steps li::before { content:counter(s); flex:none; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:14px; color:#3a1206; background:linear-gradient(135deg,var(--gold-1),var(--gold-3)); }
  .steps b { color:var(--gold-1); }

  /* ---------- Vincular ---------- */
  .code {
    font-family:ui-monospace,"SF Mono",Menlo,monospace; direction:ltr; font-size:38px; letter-spacing:10px; font-weight:700; text-align:center;
    padding:20px 10px 20px 20px; margin:6px 0 14px; border-radius:20px;
    background:linear-gradient(180deg,rgba(255,241,193,.08),rgba(212,175,55,.04)); border:1px solid var(--gold-3);
    color:var(--gold-1); text-shadow:0 0 18px rgba(243,210,122,.45);
  }
  .waiting-dots { display:inline-flex; gap:6px; margin-inline-start:8px; vertical-align:middle; }
  .waiting-dots i { width:6px; height:6px; border-radius:50%; background:var(--gold-2); animation:dot 1.2s infinite; }
  .waiting-dots i:nth-child(2){ animation-delay:.2s } .waiting-dots i:nth-child(3){ animation-delay:.4s }
  @keyframes dot { 0%,100%{ opacity:.25; transform:translateY(0) } 50%{ opacity:1; transform:translateY(-4px) } }
  .divider { display:flex; align-items:center; gap:12px; color:var(--muted-2); margin:20px 0 14px; font-size:14px; }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--card-line),transparent); }
  #codeInput { direction:ltr; text-align:center; letter-spacing:6px; text-transform:uppercase; font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:22px; }

  /* ---------- Inicio ---------- */
  .who { text-align:center; font-family:var(--font-display); font-size:24px; color:var(--gold-1); margin:8px 0 0; }
  html[dir="rtl"] .who { font-size:20px; }
  .who .amp { color:var(--rose); }

  .stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:18px 0 6px; min-height:340px; }
  .orb-wrap { position:relative; width:250px; height:250px; display:grid; place-items:center; }
  .aura { position:absolute; inset:-10px; border-radius:50%; background:radial-gradient(circle,rgba(225,29,72,.55),rgba(225,29,72,0) 65%); animation:aura 1.6s ease-in-out infinite; }
  .ring  { position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(from 0deg,var(--gold-4),var(--gold-1),var(--gold-3),var(--gold-4),var(--gold-2),var(--gold-1),var(--gold-4));
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
            mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
    animation:spin 9s linear infinite; filter:drop-shadow(0 0 8px rgba(243,210,122,.55)); }
  .ring.two { inset:14px; opacity:.55; animation-duration:14s; animation-direction:reverse;
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));
            mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px)); }
  .orb {
    position:relative; width:196px; height:196px; border-radius:50%; border:0; padding:0; cursor:pointer;
    background:radial-gradient(circle at 34% 28%,#ff8aa3 0%,var(--red) 38%,var(--red-2) 62%,#5c0a22 100%);
    box-shadow:0 25px 60px rgba(225,29,72,.5), inset 0 -16px 30px rgba(60,0,15,.55), inset 0 10px 24px rgba(255,200,210,.35);
    display:grid; place-items:center; animation:beat 1.6s ease-in-out infinite; touch-action:manipulation;
  }
  .orb::before { content:""; position:absolute; top:14px; left:38px; width:70px; height:36px; border-radius:50%; background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0)); transform:rotate(-20deg); }
  .orb svg { width:96px; height:96px; filter:drop-shadow(0 4px 10px rgba(80,0,20,.5)); }
  .orb.press { animation:press .5s cubic-bezier(.2,.9,.3,1.4); }
  .ripple { position:absolute; inset:27px; border-radius:50%; border:2px solid var(--gold-2); opacity:0; pointer-events:none; }
  .ripple.go { animation:ripple 1s ease-out forwards; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes beat { 0%,100%{transform:scale(1)} 14%{transform:scale(1.07)} 28%{transform:scale(1)} 42%{transform:scale(1.045)} 56%{transform:scale(1)} }
  @keyframes aura { 0%,100%{opacity:.55; transform:scale(.95)} 20%{opacity:.95; transform:scale(1.05)} 45%{opacity:.8; transform:scale(1.02)} }
  @keyframes press { 0%{transform:scale(1)} 30%{transform:scale(.86)} 100%{transform:scale(1)} }
  @keyframes ripple { 0%{opacity:.9; transform:scale(1)} 100%{opacity:0; transform:scale(1.9)} }

  .orb-wrap { --charge:0; transition:transform .25s cubic-bezier(.2,.9,.3,1.3); touch-action:none; }
  .orb-wrap.charging { transform:scale(calc(1 + var(--charge) * .14)); transition:none; }
  .orb-wrap.charging .orb { animation-duration:calc(1.6s - var(--charge) * 1.15s); }
  .orb-wrap.charging .aura { animation:none; opacity:calc(.6 + var(--charge) * .4); transform:scale(calc(1 + var(--charge) * .4)); }
  .orb-wrap.charging .ring { animation-duration:calc(9s - var(--charge) * 7.5s); filter:drop-shadow(0 0 calc(8px + var(--charge) * 18px) rgba(243,210,122,.8)); }
  .orb-wrap.lv3 { animation:shake .11s linear infinite; }
  @keyframes shake { 0%{translate:0 0} 25%{translate:1.5px -1px} 50%{translate:-1.5px 1px} 75%{translate:1px 1.5px} 100%{translate:0 0} }
  .orb, .orb-wrap { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .level-txt { margin-top:22px; min-height:28px; font-family:var(--font-display); font-size:26px; font-weight:700; color:var(--gold-1); text-shadow:0 0 18px rgba(243,210,122,.55); }
  html[dir="rtl"] .level-txt { font-size:22px; }
  .level-txt.pop { animation:numpop .45s cubic-bezier(.2,.9,.3,1.5); }
  .hint small { display:block; margin-top:4px; font-size:12.5px; letter-spacing:0; }
  .loading { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; min-height:60vh; text-align:center; }
  .loading .big { font-size:84px; animation:beat 1.6s ease-in-out infinite; filter:drop-shadow(0 10px 30px rgba(225,29,72,.6)); }
  .loading p { color:var(--gold-1); font-family:var(--font-display); font-size:22px; margin:0; }
  .loading .btn { width:auto; padding:12px 26px; }
  #hapticLbl { position:fixed; left:-200px; top:0; opacity:0; pointer-events:none; }
  .hint { margin-top:22px; color:var(--muted-2); font-size:14px; letter-spacing:.04em; animation:fade 2.4s ease-in-out infinite; }
  @keyframes fade { 0%,100%{opacity:.45} 50%{opacity:1} }
  .status { margin-top:16px; min-height:48px; text-align:center; line-height:1.45; padding:0 10px; color:var(--muted); font-size:16px; transition:color .3s; }
  .status.ok { color:var(--gold-1); font-family:var(--font-display); font-size:21px; font-style:italic; }
  html[dir="rtl"] .status.ok { font-style:normal; font-size:18px; }
  .status.bad { color:#fda4af; }

  /* Racha */
  .streak { display:flex; align-items:center; gap:16px; margin-top:6px; }
  .flame { flex:none; width:62px; height:62px; border-radius:18px; display:grid; place-items:center; font-size:34px;
    background:radial-gradient(circle at 50% 70%,rgba(251,146,60,.35),rgba(225,29,72,.15) 60%,transparent);
    border:1px solid var(--card-line); }
  .flame.lit span { display:inline-block; animation:flicker 1.4s ease-in-out infinite; transform-origin:50% 90%; }
  .flame.off { filter:grayscale(1) opacity(.45); }
  @keyframes flicker { 0%,100%{transform:scale(1) rotate(-2deg)} 50%{transform:scale(1.12) rotate(3deg)} }
  .streak-num { font-family:var(--font-display); font-size:46px; font-weight:700; line-height:.9;
    background:linear-gradient(180deg,var(--gold-1),var(--gold-3)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  html[dir="rtl"] .streak-num { font-family:"Vazirmatn"; font-size:40px; }
  .streak-txt { color:var(--gold-2); font-size:15px; font-weight:600; }
  .streak-best { color:var(--muted-2); font-size:13px; margin-top:3px; }
  .streak-main { flex:1; min-width:0; }
  .streak-main .row { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .today { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; align-items:center; }
  .today-label { color:var(--muted-2); font-size:13px; margin-inline-end:2px; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; font-size:14px;
    border:1px solid rgba(255,255,255,.12); color:var(--muted); background:rgba(255,255,255,.03); transition:all .35s; }
  .chip.done { border-color:var(--gold-3); color:var(--gold-1); background:rgba(212,175,55,.12); }
  .chip .dot { width:8px; height:8px; border-radius:50%; background:var(--muted-2); }
  .chip.done .dot { background:var(--gold-2); box-shadow:0 0 10px var(--gold-2); }
  .streak-hint { color:var(--muted-2); font-size:13px; line-height:1.45; margin:12px 0 0; }
  .pop { animation:numpop .7s cubic-bezier(.2,.9,.3,1.5); }
  @keyframes numpop { 0%{transform:scale(1)} 35%{transform:scale(1.45)} 100%{transform:scale(1)} }

  .notif { text-align:center; margin-top:16px; font-size:14px; color:var(--muted-2); }
  .notif button { background:none; border:1px dashed var(--gold-3); color:var(--gold-1); padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.35; }

  /* ---------- Mensajes ---------- */
  .list { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px; }
  .list li { display:flex; gap:12px; align-items:flex-start; justify-content:space-between; padding:14px 16px; border-radius:18px;
    background:var(--card); border:1px solid var(--card-line); line-height:1.4; animation:rise .45s both; }
  .list li .txt { flex:1; min-width:0; overflow-wrap:anywhere; }
  .list li small { display:block; color:var(--muted-2); font-size:12.5px; margin-top:5px; }
  .list li.recv { border-inline-start:3px solid var(--red); }
  .del { flex:none; width:30px; height:30px; border-radius:50%; border:1px solid rgba(255,255,255,.12); background:transparent; color:var(--muted-2); font-size:18px; line-height:1; }
  .del:active { color:var(--rose); border-color:var(--rose); }
  .add-row { display:flex; gap:8px; margin-top:12px; }
  .add-row .field { margin:0; }
  .add-row .btn { width:auto; margin:0; padding:0 20px; flex:none; }
  .empty { color:var(--muted-2); text-align:center; padding:18px; }

  /* ---------- Barra de pestañas ---------- */
  .tabbar { position:fixed; z-index:20; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 12px);
    width:min(440px,calc(100% - 32px)); height:var(--tab-h); display:flex; gap:6px; padding:8px; border-radius:26px;
    background:rgba(28,5,13,.72); border:1px solid var(--card-line); backdrop-filter:blur(18px) saturate(1.3); -webkit-backdrop-filter:blur(18px) saturate(1.3);
    box-shadow:0 14px 40px rgba(0,0,0,.45); }
  .tab { position:relative; flex:1; border:0; border-radius:20px; background:transparent; color:var(--muted-2); font-size:12.5px; font-weight:600;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; transition:color .25s, background .25s; }
  .tab svg { width:24px; height:24px; }
  .tab.on { color:var(--gold-1); background:linear-gradient(180deg,rgba(225,29,72,.35),rgba(136,19,55,.35)); }
  .tab .badge { position:absolute; top:8px; inset-inline-end:calc(50% - 22px); min-width:18px; height:18px; padding:0 5px; border-radius:9px;
    background:var(--red); color:#fff; font-size:11px; display:grid; place-items:center; box-shadow:0 0 0 2px #1d050d; }

  /* ---------- Carta recibida ---------- */
  .letter { position:fixed; inset:0; z-index:60; display:grid; place-items:center; padding:24px; background:rgba(10,1,4,.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); animation:fadein .35s both; }
  .letter .paper { width:min(380px,100%); text-align:center; padding:34px 26px 26px; border-radius:28px; position:relative;
    background:linear-gradient(160deg,#4a0b1f 0%,#2a0611 100%); border:1px solid var(--gold-3);
    box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 6px rgba(212,175,55,.08), inset 0 1px 0 rgba(255,241,193,.2);
    animation:unfold .7s cubic-bezier(.2,.9,.25,1.2) both; }
  .letter .seal { width:74px; height:74px; margin:-72px auto 14px; border-radius:50%; display:grid; place-items:center; font-size:34px;
    background:radial-gradient(circle at 35% 30%,#ff8aa3,var(--red) 45%,var(--red-3)); border:3px solid var(--gold-2); box-shadow:0 10px 30px rgba(225,29,72,.5); }
  .letter .from { color:var(--gold-2); font-size:15px; font-weight:600; letter-spacing:.03em; }
  .letter .msg { font-family:var(--font-display); font-size:30px; line-height:1.2; color:var(--cream); margin:14px 0 18px; }
  html[dir="rtl"] .letter .msg { font-size:24px; line-height:1.6; }
  .letter .close { color:var(--muted-2); font-size:13px; }
  @keyframes fadein { from{opacity:0} to{opacity:1} }
  @keyframes unfold { from{opacity:0; transform:translateY(40px) scale(.85) rotateX(25deg)} to{opacity:1; transform:none} }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
  @media (max-height:700px) {
    .orb-wrap { width:210px; height:210px; } .orb { width:164px; height:164px; } .orb svg { width:80px; height:80px; }
    .stage { min-height:280px; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="fx"></canvas>

<main id="main">
  <header>
    <div class="brand"><div class="logo">Sahar</div><small>LOVE</small></div>
    <label class="lang" aria-label="Language">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
      <span id="langName"></span>
      <select id="langSelect"></select>
    </label>
  </header>

  <!-- Cargando (el servidor gratis puede tardar en despertar) -->
  <section id="loadingView" class="view loading">
    <div class="big">💗</div>
    <p data-i18n="waking"></p>
    <button class="btn ghost hidden" id="retryBtn" data-i18n="retry"></button>
  </section>

  <!-- Instalar en iPhone -->
  <section id="installView" class="view hidden">
    <h1 data-i18n="installTitle"></h1>
    <p class="sub" data-i18n="installSub"></p>
    <div class="card">
      <ol class="steps">
        <li data-i18n-html="install1"></li>
        <li data-i18n-html="install2"></li>
        <li data-i18n-html="install3"></li>
        <li data-i18n-html="install4"></li>
      </ol>
    </div>
  </section>

  <!-- Nombre -->
  <section id="nameView" class="view hidden">
    <p class="tagline" data-i18n="tagline"></p>
    <h1 data-i18n="askName"></h1>
    <input id="nameInput" class="field" data-i18n-ph="namePh" maxlength="30" autocomplete="given-name">
    <button class="btn" id="nameBtn" data-i18n="continue"></button>
    <div class="err" id="nameErr"></div>
  </section>

  <!-- Vincular -->
  <section id="coupleView" class="view hidden">
    <h1 data-i18n="linkTitle"></h1>
    <p class="sub" data-i18n="linkSub"></p>
    <button class="btn gold" id="createBtn" data-i18n="createCode"></button>
    <div id="codeBox" class="hidden">
      <div class="code" id="codeText"></div>
      <p class="sub"><span data-i18n="waiting"></span><span class="waiting-dots"><i></i><i></i><i></i></span></p>
      <button class="btn ghost" id="shareBtn" data-i18n="share"></button>
    </div>
    <div id="joinBox">
      <div class="divider" data-i18n="haveCode"></div>
      <input id="codeInput" class="field" data-i18n-ph="codePh" maxlength="6" autocapitalize="characters" autocomplete="off" spellcheck="false">
      <button class="btn ghost" id="joinBtn" data-i18n="join"></button>
    </div>
    <div class="err" id="coupleErr"></div>
  </section>

  <!-- Inicio -->
  <section id="homeView" class="view hidden" style="display:flex;flex-direction:column;flex:1">
    <div class="who" id="whoText"></div>
    <div class="together hidden" id="togetherText"></div>
    <div class="stage">
      <div class="orb-wrap">
        <div class="aura"></div>
        <div class="ring"></div>
        <div class="ring two"></div>
        <div class="ripple" id="ripple1"></div>
        <div class="ripple" id="ripple2"></div>
        <button class="orb" id="heartBtn" aria-label="❤">
          <svg viewBox="0 0 24 24"><defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e6"/><stop offset=".55" stop-color="#f3d27a"/><stop offset="1" stop-color="#c79a2c"/></linearGradient></defs>
            <path fill="url(#hg)" d="M12 21.2l-1.3-1.2C5.6 15.4 2.4 12.5 2.4 8.9 2.4 6 4.7 3.7 7.6 3.7c1.7 0 3.3.8 4.4 2 1.1-1.2 2.7-2 4.4-2 2.9 0 5.2 2.3 5.2 5.2 0 3.6-3.2 6.5-8.3 11.1L12 21.2z"/></svg>
        </button>
      </div>
      <div class="level-txt hidden" id="levelTxt"></div>
      <div class="hint" id="hint"><span data-i18n="tapHint"></span><small data-i18n="holdHint"></small></div>
      <div class="status" id="status"></div>
    </div>

    <div class="card">
      <div class="streak">
        <div class="flame" id="flame"><span>🔥</span></div>
        <div class="streak-main">
          <div class="row"><span class="streak-num" id="streakNum">0</span><span class="streak-txt" id="streakTxt"></span></div>
          <div class="streak-best" id="streakBest"></div>
        </div>
      </div>
      <div class="today">
        <span class="today-label" data-i18n="today"></span>
        <span class="chip" id="chipMe"><i class="dot"></i><span id="chipMeTxt"></span></span>
        <span class="chip" id="chipPartner"><i class="dot"></i><span id="chipPartnerTxt"></span></span>
      </div>
      <p class="streak-hint" data-i18n="streakHint"></p>
    </div>
    <div class="notif" id="notifBox"></div>
  </section>

  <!-- Mensajes -->
  <section id="msgsView" class="view hidden">
    <h2 data-i18n="us"></h2>
    <div class="card">
      <div class="since-row">
        <label for="sinceInput" data-i18n="since"></label>
        <input type="date" id="sinceInput" class="field">
      </div>
      <div class="us-grid">
        <div class="stat"><b id="statSent">0</b><span data-i18n="sentLbl"></span></div>
        <div class="stat"><b id="statRecv">0</b><span data-i18n="recvLbl"></span></div>
      </div>
    </div>

    <h2 data-i18n="receivedTitle"></h2>
    <ul class="list" id="recvList"></ul>

    <h2 data-i18n="msgsTitle"></h2>
    <p class="sub" style="margin-bottom:12px" data-i18n="msgsSub"></p>
    <ul class="list" id="msgList"></ul>
    <div class="add-row">
      <input id="newMsg" class="field" data-i18n-ph="newPh" maxlength="140" autocomplete="off">
      <button class="btn" id="addMsg" data-i18n="add"></button>
    </div>
    <div class="err" id="msgErr"></div>
  </section>
</main>

<nav class="tabbar hidden" id="tabbar">
  <button class="tab on" data-tab="home">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.2l-1.3-1.2C5.6 15.4 2.4 12.5 2.4 8.9 2.4 6 4.7 3.7 7.6 3.7c1.7 0 3.3.8 4.4 2 1.1-1.2 2.7-2 4.4-2 2.9 0 5.2 2.3 5.2 5.2 0 3.6-3.2 6.5-8.3 11.1L12 21.2z"/></svg>
    <span data-i18n="tabHome"></span>
  </button>
  <button class="tab" data-tab="msgs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg>
    <span data-i18n="tabMsgs"></span>
    <span class="badge hidden" id="badge"></span>
  </button>
</nav>

<div class="letter hidden" id="letter">
  <div class="paper">
    <div class="seal">💌</div>
    <div class="from" id="letterFrom"></div>
    <div class="msg" id="letterMsg"></div>
    <button class="btn" id="replyBtn" data-i18n="replyBack"></button>
    <div class="close" data-i18n="tapClose"></div>
  </div>
</div>

<label id="hapticLbl" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
<script src="/i18n.js"></script>
<script>
const I = window.SaharI18n;
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
};

/* =================== Idioma =================== */
let lang = I.pick(store.get('sahar_lang') || I.detect(navigator.languages || [navigator.language]));
const t = (k, v) => I.t(lang, k, v);
const showMsg = (m) => I.localizeMessage(m, lang);
const num = (n) => I.fmtNum(lang, n);

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = I.RTL.includes(lang) ? 'rtl' : 'ltr';
  $('langName').textContent = I.LANG_NAMES[lang];
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
  if (state) render(false);
}
const sel = $('langSelect');
I.LANGS.forEach((l) => { const o = document.createElement('option'); o.value = l; o.textContent = I.LANG_NAMES[l]; sel.append(o); });
sel.value = lang;
sel.onchange = async () => {
  lang = sel.value; store.set('sahar_lang', lang); applyLang();
  if (state && state.name) { try { state = await api('/api/lang', 'POST', { lang }); render(false); } catch (_) {} }
};

/* =================== API =================== */
let userId = store.get('sahar_uid');
if (!userId) { userId = (crypto.randomUUID ? crypto.randomUUID() : 'u' + Math.random().toString(36).slice(2) + Date.now()); store.set('sahar_uid', userId); }

async function api(path, method = 'GET', body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (method === 'GET') path += (path.includes('?') ? '&' : '?') + 'userId=' + encodeURIComponent(userId);
  else opts.body = JSON.stringify({ userId, ...body });
  let res;
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 75000);
    res = await fetch(path, { ...opts, signal: ctrl.signal });
    clearTimeout(timer);
  } catch (_) { const e = new Error('network'); e.code = 'network'; throw e; }
  const data = await res.json().catch(() => ({}));
  if (res.ok && data && 'streak' in data && 'name' in data) store.set('sahar_state', JSON.stringify(data));
  if (!res.ok) { const e = new Error(data.code || 'network'); e.code = data.code || 'network'; e.partner = data.partner; throw e; }
  return data;
}
const errText = (e) => t('err.' + (e.code || 'network'), { p: e.partner || (state && state.partnerName) || '' });

/* =================== Estado y vistas =================== */
let state = null;
let tab = 'home';
let pollTimer = null;
let shownStreak = null;
const isStandalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const VIEWS = ['loadingView', 'installView', 'nameView', 'coupleView', 'homeView', 'msgsView'];

function show(name) {
  VIEWS.forEach((v) => {
    const el = $(v); const on = v === name;
    if (on && el.classList.contains('hidden')) { el.classList.remove('hidden'); el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; }
    else if (!on) el.classList.add('hidden');
  });
  const inApp = name === 'homeView' || name === 'msgsView';
  $('tabbar').classList.toggle('hidden', !inApp);
  $('main').classList.toggle('with-tabs', inApp);
}

function render(fresh = true) {
  clearInterval(pollTimer); pollTimer = null;
  if (!state || !state.name) return show('nameView');
  if (!state.code || !state.partnerName) {
    show('coupleView');
    const waiting = !!state.code;
    $('createBtn').classList.toggle('hidden', waiting);
    $('codeBox').classList.toggle('hidden', !waiting);
    $('joinBox').classList.toggle('hidden', waiting);
    if (waiting) { $('codeText').textContent = state.code; pollTimer = setInterval(refresh, 3000); }
    return;
  }
  show(tab === 'home' ? 'homeView' : 'msgsView');
  pollTimer = setInterval(refresh, 20000);
  renderHome(fresh);
  renderMessages();
  checkNewLove();
}

async function refresh() {
  try { state = await api('/api/state'); render(false); } catch (_) {}
}

/* ----- Inicio ----- */
function renderHome(animate) {
  const p = state.partnerName;
  $('whoText').innerHTML = '';
  const parts = t('youAnd', { p: '\u0000' }).split('\u0000');
  $('whoText').append(document.createTextNode(parts[0]));
  const pn = document.createElement('span'); pn.className = 'amp'; pn.textContent = p; $('whoText').append(pn);
  $('whoText').append(document.createTextNode(parts[1] || ''));

  const tg = $('togetherText');
  if (state.since) {
    const d = daysSince(state.since);
    tg.textContent = '💞 ' + t('together', { n: num(d), days: I.plural(lang, d, I.STRINGS[lang].days) });
    tg.classList.remove('hidden');
  } else tg.classList.add('hidden');

  const n = state.streak;
  const numEl = $('streakNum');
  if (shownStreak !== null && n > shownStreak && animate !== false) countUp(numEl, shownStreak, n);
  else numEl.textContent = num(n);
  shownStreak = n;
  $('streakTxt').textContent = `${I.plural(lang, n, I.STRINGS[lang].days)} · ${t('streak')}`;
  $('streakBest').textContent = t('best', { n: num(Math.max(state.bestStreak, n)) });
  $('flame').classList.toggle('lit', n > 0 || state.iSentToday);
  $('flame').classList.toggle('off', n === 0 && !state.iSentToday);

  $('chipMe').classList.toggle('done', state.iSentToday);
  $('chipPartner').classList.toggle('done', state.partnerSentToday);
  $('chipMeTxt').textContent = `${t('you')} ${state.iSentToday ? '✓' : '…'}`;
  $('chipPartnerTxt').textContent = `${p} ${state.partnerSentToday ? '✓' : '…'}`;
  renderNotifBox();
}

function daysSince(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const now = new Date();
  return Math.max(0, Math.round((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - Date.UTC(y, m - 1, d)) / 86400000));
}

function countUp(el, from, to) {
  const start = performance.now(), dur = 700;
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  (function step(now) {
    const k = Math.min(1, (now - start) / dur);
    el.textContent = num(Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))));
    if (k < 1) requestAnimationFrame(step);
  })(start);
}

/* ----- Mensajes ----- */
function fmtDate(ms) {
  try { return new Intl.DateTimeFormat(I.LOCALES[lang], { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(ms)); }
  catch (_) { return new Date(ms).toLocaleString(); }
}
function renderMessages() {
  $('statSent').textContent = num(state.totalSent || 0);
  $('statRecv').textContent = num(state.totalReceived || 0);
  const si = $('sinceInput');
  if (document.activeElement !== si) si.value = state.since || '';
  si.max = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const list = $('msgList'); list.innerHTML = '';
  state.messages.forEach((m, i) => {
    const li = document.createElement('li'); li.style.animationDelay = `${Math.min(i, 12) * 35}ms`;
    const span = document.createElement('span'); span.className = 'txt'; span.textContent = showMsg(m);
    const del = document.createElement('button'); del.className = 'del'; del.textContent = '×'; del.setAttribute('aria-label', '×');
    del.onclick = async () => {
      li.style.transition = 'opacity .25s, transform .25s'; li.style.opacity = '0'; li.style.transform = 'scale(.96)';
      try { state = await api('/api/messages', 'DELETE', { index: i }); $('msgErr').textContent = ''; renderMessages(); }
      catch (e) { li.style.opacity = '1'; li.style.transform = ''; $('msgErr').textContent = errText(e); }
    };
    li.append(span, del); list.append(li);
  });
  const recv = $('recvList'); recv.innerHTML = '';
  if (!state.received.length) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = t('receivedEmpty'); recv.append(li); }
  state.received.slice(0, 20).forEach((r, i) => {
    const li = document.createElement('li'); li.className = 'recv'; li.style.animationDelay = `${Math.min(i, 12) * 35}ms`;
    const box = document.createElement('span'); box.className = 'txt'; box.textContent = showMsg(r.body);
    const small = document.createElement('small'); small.textContent = `${r.from} ${'💗'.repeat(r.level || 1)} · ${fmtDate(r.at)}`;
    box.append(small); li.append(box); recv.append(li);
  });
  updateBadge();
}

/* ----- Carta al abrir: lo último que te llegó ----- */
function lastSeen() { return Number(store.get('sahar_seen') || 0); }
function updateBadge() {
  const seen = Number(store.get('sahar_seen_list') || 0);
  const n = state.received.filter((r) => r.at > seen).length;
  $('badge').textContent = n > 9 ? '9+' : num(n);
  $('badge').classList.toggle('hidden', n === 0 || tab === 'msgs');
}
function checkNewLove() {
  const r = state.received[0];
  if (!r || r.at <= lastSeen() || !$('letter').classList.contains('hidden')) return;
  store.set('sahar_seen', String(r.at));
  if (lastSeen() && Date.now() - r.at > 1000 * 60 * 60 * 24 * 3) return;
  const lv = r.level || 1;
  $('letterFrom').textContent = `${t('newLove', { p: r.from })} ${'💗'.repeat(lv)}`;
  $('letterMsg').textContent = showMsg(r.body);
  $('letter').classList.remove('hidden');
  setTimeout(() => { const b = $('letter').querySelector('.seal').getBoundingClientRect(); FX.burst(b.left + b.width / 2, b.top + b.height / 2, 40 + lv * 25); }, 350);
  FX.shower(1400 + lv * 900);
}
$('letter').onclick = (e) => { if (e.target.id !== 'replyBtn') $('letter').classList.add('hidden'); };
$('replyBtn').onclick = () => {
  $('letter').classList.add('hidden');
  if (tab !== 'home') document.querySelector('.tab[data-tab=home]').click();
  setTimeout(() => sendLove(2), 250);
};
$('sinceInput').onchange = async () => {
  try { state = await api('/api/since', 'POST', { date: $('sinceInput').value || null }); render(false); if (state.since) FX.shower(1200); }
  catch (e) { $('msgErr').textContent = errText(e); }
};

/* ----- Notificaciones ----- */
function urlB64ToUint8Array(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}
async function enableNotifications() {
  const reg = await navigator.serviceWorker.ready;
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { const e = new Error('denied'); e.denied = true; throw e; }
  const { publicKey } = await api('/api/vapid');
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8Array(publicKey) });
  await api('/api/subscribe', 'POST', { subscription: sub.toJSON() });
}
let notifSynced = false;
function renderNotifBox() {
  const box = $('notifBox'); box.innerHTML = '';
  if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) { box.textContent = t('notifUnsupported'); return; }
  if (Notification.permission === 'granted') {
    if (!notifSynced) { notifSynced = true; enableNotifications().catch(() => {}); }
    box.textContent = t('notifOn');
  } else {
    const b = document.createElement('button'); b.textContent = t('notifEnable');
    b.onclick = async () => { try { await enableNotifications(); renderNotifBox(); } catch (e) { box.textContent = e.denied ? t('notifDenied') : errText(e); } };
    box.append(b);
  }
}

/* =================== Eventos =================== */
$('nameBtn').onclick = async () => {
  const name = $('nameInput').value.trim(); if (!name) return $('nameInput').focus();
  $('nameBtn').disabled = true;
  try {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    state = await api('/api/register', 'POST', { name, tz, lang }); render();
  } catch (e) { $('nameErr').textContent = errText(e); }
  $('nameBtn').disabled = false;
};
$('nameInput').onkeydown = (e) => { if (e.key === 'Enter') $('nameBtn').click(); };
$('createBtn').onclick = async () => {
  try { state = await api('/api/couple/create', 'POST', {}); $('coupleErr').textContent = ''; render(); } catch (e) { $('coupleErr').textContent = errText(e); }
};
$('joinBtn').onclick = async () => {
  try {
    state = await api('/api/couple/join', 'POST', { code: $('codeInput').value }); $('coupleErr').textContent = ''; render();
    if (state.partnerName) FX.shower(2500);
  } catch (e) { $('coupleErr').textContent = errText(e); }
};
$('shareBtn').onclick = async () => {
  const text = `Sahar 💗 ${state.code}\n${location.origin}`;
  try { if (navigator.share) await navigator.share({ title: 'Sahar', text }); else { await navigator.clipboard.writeText(text); $('shareBtn').textContent = '✓'; } } catch (_) {}
};
$('addMsg').onclick = async () => {
  const text = $('newMsg').value.trim(); if (!text) return;
  try { state = await api('/api/messages', 'POST', { text }); $('newMsg').value = ''; $('msgErr').textContent = ''; renderMessages(); const last = $('msgList').lastElementChild; last && last.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  catch (e) { $('msgErr').textContent = errText(e); }
};
$('newMsg').onkeydown = (e) => { if (e.key === 'Enter') $('addMsg').click(); };

document.querySelectorAll('.tab').forEach((b) => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === b));
  show(tab === 'home' ? 'homeView' : 'msgsView');
  if (tab === 'msgs') { store.set('sahar_seen_list', String(Date.now())); updateBadge(); refresh(); }
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ----- Corazón: toca o mantén presionado (más tiempo = más fuerza) ----- */
let sending = false;
let hold = null;
const orbWrap = document.querySelector('.orb-wrap');
const heartBtn = $('heartBtn');
const LEVEL_MS = [0, 600, 1400];
const levelFor = (ms) => (ms >= LEVEL_MS[2] ? 3 : ms >= LEVEL_MS[1] ? 2 : 1);
function haptic(pattern) {
  // iPhone (iOS 18+): un toque háptico leve; Android: vibración real
  try { $('hapticLbl').click(); } catch (_) {}
  if (navigator.vibrate) navigator.vibrate(pattern);
}
function heartCenter() { const r = heartBtn.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
function showLevel(lv) {
  const el = $('levelTxt');
  el.textContent = t('lvl' + lv);
  el.classList.remove('hidden', 'pop'); void el.offsetWidth; el.classList.add('pop');
  $('hint').classList.add('hidden');
  orbWrap.classList.toggle('lv3', lv === 3);
}
function resetCharge() {
  orbWrap.classList.remove('charging', 'lv3');
  orbWrap.style.setProperty('--charge', 0);
}
function startHold(e) {
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  try { heartBtn.setPointerCapture(e.pointerId); } catch (_) {}
  hold = { t0: performance.now(), level: 1 };
  orbWrap.classList.add('charging');
  showLevel(1);
  haptic(15);
  (function loop() {
    if (!hold) return;
    const ms = performance.now() - hold.t0;
    orbWrap.style.setProperty('--charge', Math.min(1, ms / 1700).toFixed(3));
    const lv = levelFor(ms);
    if (lv !== hold.level) {
      hold.level = lv;
      showLevel(lv);
      haptic(lv === 2 ? [40] : [70, 40, 90]);
      const [x, y] = heartCenter(); FX.burst(x, y, lv * 10);
    }
    requestAnimationFrame(loop);
  })();
}
function endHold() {
  if (!hold) return;
  const lv = hold.level;
  hold = null;
  resetCharge();
  sendLove(lv);
}
function cancelHold() {
  if (!hold) return;
  hold = null;
  resetCharge();
  $('levelTxt').classList.add('hidden');
}
heartBtn.addEventListener('pointerdown', startHold);
heartBtn.addEventListener('pointerup', endHold);
heartBtn.addEventListener('pointercancel', cancelHold);
heartBtn.addEventListener('contextmenu', (e) => e.preventDefault());
heartBtn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sendLove(1); } });

async function sendLove(level = 1) {
  const st = $('status');
  const [x, y] = heartCenter();
  FX.burst(x, y, 30 + level * 22);
  if (level === 3) setTimeout(() => FX.burst(x, y, 50), 180);
  heartBtn.classList.remove('press'); void heartBtn.offsetWidth; heartBtn.classList.add('press');
  ['ripple1', 'ripple2'].forEach((id, i) => { const el = $(id); el.classList.remove('go'); void el.offsetWidth; setTimeout(() => el.classList.add('go'), i * 180); });
  haptic(level === 1 ? [30] : level === 2 ? [40, 50, 60] : [60, 40, 80, 40, 120]);
  if (sending) return;
  sending = true;
  $('hint').classList.add('hidden');
  $('levelTxt').textContent = t('lvl' + level); $('levelTxt').classList.remove('hidden');
  st.className = 'status'; st.textContent = t('sending');
  try {
    const before = state.streak;
    const res = await api('/api/send', 'POST', { level });
    state = { ...state, ...res };
    st.className = 'status ok'; st.textContent = t('delivered', { m: showMsg(res.body) });
    renderHome(true);
    if (res.streak > before || level === 3) FX.shower(level === 3 ? 2200 : 1800);
  } catch (e) { st.className = 'status bad'; st.textContent = errText(e); }
  sending = false;
}

/* =================== Efectos (corazones y destellos) =================== */
const FX = (() => {
  const sky = $('sky'), fx = $('fx');
  const cs = sky.getContext('2d'), cf = fx.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ambient = [], bursts = [];
  const REDS = ['#e11d48', '#fb7185', '#be123c', '#ff4d6d'];
  const GOLDS = ['#f3d27a', '#fff1c1', '#d4af37'];
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    for (const c of [sky, fx]) { c.width = W * dpr; c.height = H * dpr; c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0); }
  }
  function heart(ctx, x, y, s, rot, color, alpha) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = alpha; ctx.fillStyle = color;
    ctx.beginPath(); const h = s;
    ctx.moveTo(0, h * 0.3 - h / 2);
    ctx.bezierCurveTo(0, -h / 2, -h * 0.5, -h / 2, -h * 0.5, h * 0.3 - h / 2);
    ctx.bezierCurveTo(-h * 0.5, h * 0.6 - h / 2, 0, h * 0.8 - h / 2, 0, h / 2);
    ctx.bezierCurveTo(0, h * 0.8 - h / 2, h * 0.5, h * 0.6 - h / 2, h * 0.5, h * 0.3 - h / 2);
    ctx.bezierCurveTo(h * 0.5, -h / 2, 0, -h / 2, 0, h * 0.3 - h / 2);
    ctx.fill(); ctx.restore();
  }
  function spark(ctx, x, y, s, alpha, color) {
    ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.translate(x, y);
    ctx.beginPath();
    for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); ctx.moveTo(0, 0); ctx.quadraticCurveTo(s * 0.15, s * 0.15, 0, s); ctx.quadraticCurveTo(-s * 0.15, s * 0.15, 0, 0); }
    ctx.fill(); ctx.restore();
  }
  function spawnAmbient(initial) {
    const isHeart = Math.random() < 0.55;
    ambient.push({
      x: Math.random() * W, y: initial ? Math.random() * H : H + 20,
      vy: -(0.15 + Math.random() * 0.35), sway: Math.random() * Math.PI * 2, swayS: 0.004 + Math.random() * 0.008,
      s: isHeart ? 6 + Math.random() * 12 : 3 + Math.random() * 6, heart: isHeart,
      c: isHeart ? REDS[(Math.random() * REDS.length) | 0] : GOLDS[(Math.random() * GOLDS.length) | 0],
      a: 0.12 + Math.random() * 0.35, tw: Math.random() * Math.PI * 2, rot: (Math.random() - 0.5) * 0.6,
    });
  }
  function burst(x, y, n = 40) {
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 6.5, isHeart = Math.random() < 0.6;
      bursts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 2.5, g: 0.09 + Math.random() * 0.06,
        s: isHeart ? 9 + Math.random() * 14 : 6 + Math.random() * 8, heart: isHeart,
        c: isHeart ? REDS[(Math.random() * REDS.length) | 0] : GOLDS[(Math.random() * GOLDS.length) | 0],
        life: 1, decay: 0.008 + Math.random() * 0.012, rot: (Math.random() - 0.5) * 1.2, vr: (Math.random() - 0.5) * 0.12 });
    }
  }
  function shower(ms = 2000) {
    if (reduce) return;
    const end = performance.now() + ms;
    (function drop() {
      if (performance.now() > end) return;
      for (let i = 0; i < 3; i++) bursts.push({ x: Math.random() * W, y: -20, vx: (Math.random() - 0.5) * 1.2, vy: 1.5 + Math.random() * 2.5, g: 0.03,
        s: 10 + Math.random() * 16, heart: Math.random() < 0.75, c: Math.random() < 0.7 ? REDS[(Math.random() * REDS.length) | 0] : GOLDS[(Math.random() * GOLDS.length) | 0],
        life: 1, decay: 0.004, rot: (Math.random() - 0.5), vr: (Math.random() - 0.5) * 0.06 });
      setTimeout(drop, 60);
    })();
  }
  function frame() {
    cs.clearRect(0, 0, W, H);
    const target = reduce ? 12 : Math.round(Math.min(46, W * H / 16000));
    while (ambient.length < target) spawnAmbient(false);
    for (let i = ambient.length - 1; i >= 0; i--) {
      const p = ambient[i];
      p.y += p.vy; p.sway += p.swayS; p.tw += 0.03;
      const x = p.x + Math.sin(p.sway) * 14;
      const a = p.a * (p.heart ? 1 : 0.6 + 0.4 * Math.sin(p.tw));
      if (p.heart) heart(cs, x, p.y, p.s, p.rot, p.c, a); else spark(cs, x, p.y, p.s, a, p.c);
      if (p.y < -30) ambient.splice(i, 1);
    }
    cf.clearRect(0, 0, W, H);
    for (let i = bursts.length - 1; i >= 0; i--) {
      const p = bursts[i];
      p.vy += p.g; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.decay;
      if (p.heart) heart(cf, p.x, p.y, p.s, p.rot, p.c, Math.max(0, p.life)); else spark(cf, p.x, p.y, p.s, Math.max(0, p.life), p.c);
      if (p.life <= 0 || p.y > H + 40) bursts.splice(i, 1);
    }
    requestAnimationFrame(frame);
  }
  resize(); addEventListener('resize', resize);
  for (let i = 0; i < 30; i++) spawnAmbient(true);
  requestAnimationFrame(frame);
  return { burst, shower };
})();

/* =================== Arranque =================== */
(async function init() {
  applyLang();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  const params = new URLSearchParams(location.search);
  if (isIOS && !isStandalone && !params.has('preview')) return show('installView');
  // Mostrar al instante lo último conocido (el servidor gratis puede tardar en despertar)
  try { const cached = JSON.parse(store.get('sahar_state') || 'null'); if (cached && cached.name) { state = cached; render(false); } } catch (_) {}
  if (!state) show('loadingView');
  // Reintenta hasta que el servidor despierte (hasta ~2 minutos)
  let ok = false;
  for (let i = 0; i < 8 && !ok; i++) {
    try { state = await api('/api/state'); ok = true; }
    catch (e) {
      if (e.code === 'unknown_user') { state = null; ok = true; }
      else if (state && state.name) break; // ya mostramos lo guardado; se actualizará solo
      else await new Promise((r) => setTimeout(r, 4000));
    }
  }
  if (!ok && !(state && state.name)) {
    $('retryBtn').classList.remove('hidden');
    $('retryBtn').onclick = () => location.reload();
    return;
  }
  if (state && state.lang && state.lang !== lang && !store.get('sahar_lang')) { lang = state.lang; sel.value = lang; applyLang(); }
  render();
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden && state && state.code) refresh(); });
</script>
